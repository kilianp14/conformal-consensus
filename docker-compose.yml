x-common-server-variables: &common-server-variables
  RUST_LOG: "info"
  SERVER_CONFIG_FILE: "/app/server-config.toml"
  CLUSTER_CONFIG_FILE: "/app/cluster-config.toml"

services:
  # --- SERVERS ---
  s1:
    image: omnipaxos-server
    build: { context: ./, dockerfile: server.dockerfile }
    container_name: s1
    environment: *common-server-variables
    volumes:
      - ./configs/server_1.toml:/app/server-config.toml
      - ./configs/cluster.toml:/app/cluster-config.toml
      - ./results/:/app/results/

  s2: &server-base
    image: omnipaxos-server
    container_name: s2
    environment: *common-server-variables
    volumes:
      - ./configs/server_2.toml:/app/server-config.toml
      - ./configs/cluster.toml:/app/cluster-config.toml
      - ./results/:/app/results/

  s3:
    <<: *server-base
    container_name: s3
    volumes:
      - ./configs/server_3.toml:/app/server-config.toml
      - ./configs/cluster.toml:/app/cluster-config.toml
      - ./results/:/app/results/


  # --- CLIENTS ---
  c1:
    image: omnipaxos-client
    build: { context: ./, dockerfile: client.dockerfile }
    container_name: c1
    environment:
      RUST_LOG: "info"
      CONFIG_FILE: "/app/client-config.toml"
    volumes:
      - ./configs/client_1.toml:/app/client-config.toml
      - ./results/:/app/results/

  c2: &client-base
    image: omnipaxos-client
    container_name: c2
    environment:
      RUST_LOG: "info"
      CONFIG_FILE: "/app/client-config.toml"
    volumes:
      - ./configs/client_2.toml:/app/client-config.toml
      - ./results/:/app/results/

  c3:
    <<: *client-base
    container_name: c3
    environment:
      RUST_LOG: "info"
      CONFIG_FILE: "/app/client-config.toml"
    volumes:
      - ./configs/client_3.toml:/app/client-config.toml
      - ./results/:/app/results/

